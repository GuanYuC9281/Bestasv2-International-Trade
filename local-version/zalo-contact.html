<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>貝達國際貿易有限公司 | Zalo 聯絡</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#ffffff">
    <style>
        :root {
            color-scheme: light;
            --page-bg: #f5f7fb;
            --surface: #ffffff;
            --text: #182232;
            --muted: #657084;
            --primary: #0068ff;
            --primary-dark: #0054cc;
            --border: #d8e0ec;
            --shadow: 0 18px 42px rgba(20, 38, 72, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 28px 18px;
            background: var(--page-bg);
            color: var(--text);
            font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            line-height: 1.5;
        }

        main {
            width: min(100%, 420px);
            padding: 28px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .mark {
            width: 68px;
            height: 68px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            font-size: 20px;
            font-weight: 700;
        }

        h1 {
            margin: 0;
            font-size: 26px;
            line-height: 1.25;
        }

        p {
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 16px;
        }

        .phone {
            display: block;
            margin: 18px 0;
            color: var(--text);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0;
            word-break: break-word;
        }

        .actions {
            display: grid;
            gap: 10px;
            margin-top: 20px;
        }

        a,
        button {
            width: 100%;
            min-height: 48px;
            border-radius: 8px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
        }

        a:focus,
        a:hover {
            background: var(--primary-dark);
        }

        button {
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text);
        }

        button:focus,
        button:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .status {
            min-height: 22px;
            margin-top: 12px;
            color: var(--primary);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">Zalo</div>
        <h1 data-i18n="title">開啟 Zalo 聯絡</h1>
        <p data-i18n="intro">按下後會複製號碼並開啟 Zalo。</p>
        <span class="phone" id="phoneText">886985328164</span>
        <div class="actions">
            <a id="openZaloLink" href="zalo://conversation?phone=886985328164" rel="noopener noreferrer" data-i18n="open">複製號碼並開啟 Zalo</a>
            <button id="copyPhoneButton" type="button" data-i18n="copy">複製號碼</button>
        </div>
        <div class="status" id="status" role="status" aria-live="polite"></div>
    </main>

    <script>
        (function () {
            const DEFAULT_PHONE = '886985328164';
            const FALLBACK_NOTICE_DELAY = 900;
            const translations = {
                en: {
                    title: 'Contact us on Zalo',
                    intro: 'The button copies the number and opens Zalo.',
                    open: 'Copy number and open Zalo',
                    copy: 'Copy number',
                    copied: 'Number copied',
                    opening: 'Opening Zalo...',
                    fallback: 'If Zalo did not open, search this number in Zalo.'
                },
                ja: {
                    title: 'Zalo で連絡',
                    intro: 'ボタンをタップすると番号をコピーして Zalo を開きます。',
                    open: '番号をコピーして Zalo を開く',
                    copy: '番号をコピー',
                    copied: '番号をコピーしました',
                    opening: 'Zalo を開いています...',
                    fallback: 'Zalo が開かない場合は、この番号を Zalo で検索してください。'
                },
                vn: {
                    title: 'Liên hệ qua Zalo',
                    intro: 'Nút này sẽ sao chép số và mở Zalo.',
                    open: 'Sao chép số và mở Zalo',
                    copy: 'Sao chép số',
                    copied: 'Đã sao chép số',
                    opening: 'Đang mở Zalo...',
                    fallback: 'Nếu Zalo không mở, hãy tìm số này trong Zalo.'
                },
                'zh-TW': {
                    title: '開啟 Zalo 聯絡',
                    intro: '按下後會複製號碼並開啟 Zalo。',
                    open: '複製號碼並開啟 Zalo',
                    copy: '複製號碼',
                    copied: '已複製號碼',
                    opening: '正在開啟 Zalo...',
                    fallback: '如果沒有開啟，請在 Zalo 搜尋這組號碼。'
                }
            };

            const params = new URLSearchParams(window.location.search);
            const phone = (params.get('phone') || DEFAULT_PHONE).replace(/\D/g, '') || DEFAULT_PHONE;
            const langParam = (params.get('lang') || 'zh-TW').toLowerCase();
            const lang = langParam.startsWith('en')
                ? 'en'
                : langParam.startsWith('ja') || langParam.startsWith('jp')
                    ? 'ja'
                    : langParam.startsWith('vn') || langParam.startsWith('vi')
                        ? 'vn'
                        : 'zh-TW';
            const t = translations[lang] || translations['zh-TW'];

            document.documentElement.lang = lang;
            document.title = t.title;
            document.querySelectorAll('[data-i18n]').forEach((node) => {
                const key = node.getAttribute('data-i18n');
                if (t[key]) node.textContent = t[key];
            });

            document.getElementById('phoneText').textContent = phone;
            const appHref = `zalo://conversation?phone=${encodeURIComponent(phone)}`;
            const openZaloLink = document.getElementById('openZaloLink');
            const copyPhoneButton = document.getElementById('copyPhoneButton');
            const status = document.getElementById('status');
            openZaloLink.href = appHref;

            async function copyPhone() {
                if (!navigator.clipboard || !window.isSecureContext) return false;

                try {
                    await navigator.clipboard.writeText(phone);
                    return true;
                } catch (error) {
                    return false;
                }
            }

            openZaloLink.addEventListener('click', async (event) => {
                event.preventDefault();
                await copyPhone();
                status.textContent = t.opening;
                window.location.href = appHref;
                window.setTimeout(() => {
                    status.textContent = t.fallback;
                }, FALLBACK_NOTICE_DELAY);
            });

            copyPhoneButton.addEventListener('click', async () => {
                if (await copyPhone()) {
                    status.textContent = t.copied;
                } else {
                    status.textContent = `${t.copy}: ${phone}`;
                }
            });
        })();
    </script>
</body>
</html>
