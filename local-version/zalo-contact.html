<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Zalo 聯絡</title>
    <style>
        :root {
            color-scheme: light;
            --page-bg: #f5f7fb;
            --surface: #ffffff;
            --text: #182232;
            --muted: #657084;
            --primary: #0068ff;
            --primary-dark: #0054cc;
            --border: #d8e0ec;
            --shadow: 0 18px 42px rgba(20, 38, 72, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 28px 18px;
            background: var(--page-bg);
            color: var(--text);
            font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            line-height: 1.5;
        }

        main {
            width: min(100%, 420px);
            padding: 28px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .mark {
            width: 68px;
            height: 68px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            font-size: 20px;
            font-weight: 700;
        }

        h1 {
            margin: 0;
            font-size: 26px;
            line-height: 1.25;
        }

        p {
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 16px;
        }

        .phone {
            display: block;
            margin: 18px 0;
            color: var(--text);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0;
            word-break: break-word;
        }

        .actions {
            display: grid;
            gap: 10px;
            margin-top: 20px;
        }

        a,
        button {
            width: 100%;
            min-height: 48px;
            border-radius: 8px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
        }

        a:focus,
        a:hover {
            background: var(--primary-dark);
        }

        button {
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text);
        }

        button:focus,
        button:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .status {
            min-height: 22px;
            margin-top: 12px;
            color: var(--primary);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">Zalo</div>
        <h1 data-i18n="title">加入 Zalo 好友</h1>
        <p data-i18n="intro">點擊按鈕後會開啟 Zalo 好友頁面。</p>
        <span class="phone" id="phoneText">84903373583</span>
        <div class="actions">
            <a id="openZaloLink" href="https://zalo.me/84903373583" rel="noopener noreferrer" data-i18n="open">開啟 Zalo</a>
            <button id="copyPhoneButton" type="button" data-i18n="copy">複製號碼</button>
        </div>
        <div class="status" id="status" role="status" aria-live="polite"></div>
    </main>

    <script>
        (function () {
            const DEFAULT_PHONE = '84903373583';
            const translations = {
                en: {
                    title: 'Add us on Zalo',
                    intro: 'Tap the button to open the Zalo contact page.',
                    open: 'Open Zalo',
                    copy: 'Copy number',
                    copied: 'Number copied'
                },
                ja: {
                    title: 'Zalo で友だち追加',
                    intro: 'ボタンをタップして Zalo の連絡先ページを開きます。',
                    open: 'Zalo を開く',
                    copy: '番号をコピー',
                    copied: '番号をコピーしました'
                },
                vn: {
                    title: 'Thêm bạn trên Zalo',
                    intro: 'Nhấn nút để mở trang liên hệ Zalo.',
                    open: 'Mở Zalo',
                    copy: 'Sao chép số',
                    copied: 'Đã sao chép số'
                },
                'zh-TW': {
                    title: '加入 Zalo 好友',
                    intro: '點擊按鈕後會開啟 Zalo 好友頁面。',
                    open: '開啟 Zalo',
                    copy: '複製號碼',
                    copied: '已複製號碼'
                }
            };

            const params = new URLSearchParams(window.location.search);
            const phone = (params.get('phone') || DEFAULT_PHONE).replace(/\D/g, '') || DEFAULT_PHONE;
            const langParam = (params.get('lang') || 'zh-TW').toLowerCase();
            const lang = langParam.startsWith('en')
                ? 'en'
                : langParam.startsWith('ja') || langParam.startsWith('jp')
                    ? 'ja'
                    : langParam.startsWith('vn') || langParam.startsWith('vi')
                        ? 'vn'
                        : 'zh-TW';
            const t = translations[lang] || translations['zh-TW'];

            document.documentElement.lang = lang;
            document.title = t.title;
            document.querySelectorAll('[data-i18n]').forEach((node) => {
                const key = node.getAttribute('data-i18n');
                if (t[key]) node.textContent = t[key];
            });

            document.getElementById('phoneText').textContent = phone;
            document.getElementById('openZaloLink').href = `https://zalo.me/${encodeURIComponent(phone)}`;

            document.getElementById('copyPhoneButton').addEventListener('click', async () => {
                const status = document.getElementById('status');
                try {
                    await navigator.clipboard.writeText(phone);
                    status.textContent = t.copied;
                } catch (error) {
                    status.textContent = phone;
                }
            });
        })();
    </script>
</body>
</html>
